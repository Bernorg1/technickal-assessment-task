databaseChangeLog:
  - changeSet:
      id: 003-create-product-attribute
      author: andrii tsyhaniuk
      changes:
        - createTable:
            tableName: product_attribute
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  
        - addForeignKeyConstraint:
            baseTableName: product_attribute
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
            constraintName: fk_product_attribute_product
